candidato: "[preencher nome]"
modelo_usado: "gemini-flash-lite-latest (nivel_2, lote real) / gemini-3.6-flash e gemini-flash-lite-latest (nivel_1, testados)"
provedor: google-ai-studio
horas_dedicadas: "[preencher]"

nivel_1:
  limpeza_dados:
    status: completo
    onde: "nivel_1/nivel_1.ipynb, células 5-13 (inspeção + limpeza), com explicação em markdown"
  regras_pandas:
    status: completo
    onde: "nivel_1/nivel_1.ipynb, células 18-24 (Regra 1 e Regra 2)"
  validacao_regras:
    status: completo
    onde: "nivel_1/nivel_1.ipynb, célula 21 (comparação caso positivo vs caso parecido, com asserts)"
  saida_estruturada:
    status: completo
    onde: "nivel_1/nivel_1.ipynb, células 31-33 e 36-37 (Pydantic Parecer + extrair_json + chamada real ao Gemini)"
    nota: >
      Executado de verdade contra a API (GEMINI_API_KEY real). Um bug real foi
      encontrado e corrigido nesse processo: a LLM devolveu "medio" sem acento e o
      Literal do Pydantic só aceitava "médio" -- corrigido com normalização em
      nivel_2/models.py (ver docs/DECISOES.md e docs/USO_DE_IA.md).
  comparacao_prompts:
    status: completo
    onde: "nivel_1/nivel_1.ipynb, células 34-40 (Prompt V1 e V2, executados com resposta real)"
    nota: >
      V1 classificou o cliente CLI-A-1 como risco "alto" com linguagem que trata a
      flag quase como prova; V2, mesmos fatos, classificou como "médio" e separou
      explicitamente FATO de HIPÓTESE na justificativa -- diferença de conteúdo real,
      documentada em docs/DECISOES.md#prompt-v1-vs-v2-nível-1-parte-b.

nivel_2:
  regras_em_escala:
    status: completo
    onde: "nivel_2/rules.py + nivel_2/top_clientes.py -> outputs/top_10_clientes.csv (gerado de verdade)"
  ferramentas:
    status: completo
    onde: "nivel_2/tools.py (historico_cliente, operacoes_do_dia, perfil_canal), testado contra a base real e via chamadas reais do agente"
  agente:
    status: completo
    onde: "nivel_2/agente.py, nivel_2/llm_client.py"
    nota: >
      Loop de tool-calling manual, limite de iterações, cache e montagem de contexto
      implementados e testados com sucesso contra a API real (10/10 clientes do lote
      com status "ok"). Dois problemas reais de camada gratuita foram encontrados e
      corrigidos ao vivo: quota diária (não por minuto) esgotada em gemini-3.6-flash,
      e retry ingênuo que não distinguia os dois casos -- ver docs/DECISOES.md.
  lote:
    status: completo
    onde: "nivel_2/lote.py -> outputs/lote.csv, outputs/pareceres/*.json"
    nota: "10/10 clientes com status ok, pareceres reais commitados."
  confronto:
    status: completo
    onde: "nivel_2/confronto.py -> outputs/confronto.csv"
    nota: >
      10/10 clientes do top10 avaliados. Taxa de concordância real: 80% (8/10).
      As 2 divergências (CLI-030, CLI-028) foram analisadas qualitativamente em
      docs/DECISOES.md#confronto -- uma favorece o agente (regra com falso positivo
      plausível), a outra favorece o baseline (agente subponderou um padrão de
      entrada/saída no mesmo dia).

nivel_3:
  trilha_escolhida: B
  status: nao_feito
